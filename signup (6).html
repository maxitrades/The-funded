<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sign Up – Maxi Capital</title>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@500;600;700&family=Satoshi:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0fd4b4;--teal-dim:rgba(15,212,180,.12);--teal-glow:rgba(15,212,180,.35);
  --emerald:#00e5a0;
  --midnight:#060a12;--surface:#0c1220;--surface-2:#121b2e;--surface-3:#182338;
  --border:rgba(15,212,180,.18);--border-dim:rgba(255,255,255,.06);
  --text:#e2f0ff;--muted:#6b8aad;--muted-2:#3a5068;
  --red:#ff4d6d;--green:#00e5a0;
}
body{font-family:'Satoshi',sans-serif;background:var(--midnight);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

.nav-scene{position:fixed;top:0;left:0;right:0;z-index:200;perspective:1000px;perspective-origin:50% -200%}
nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2.5rem;height:68px;
  background:rgba(6,10,18,.88);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  transform:rotateX(4deg);transform-origin:top center;transform-style:preserve-3d;
  box-shadow:0 8px 40px rgba(15,212,180,.08),0 2px 0 var(--border);
  transition:transform .4s ease,box-shadow .4s ease;
}
nav:hover{transform:rotateX(0deg);box-shadow:0 12px 60px rgba(15,212,180,.15),0 2px 0 var(--border)}
.nav-logo{font-family:'Clash Display',sans-serif;font-size:1.35rem;font-weight:700;color:var(--teal);text-decoration:none;text-shadow:0 0 30px var(--teal-glow)}
.nav-links{display:flex;gap:.75rem;align-items:center}
.nav-links a{color:var(--muted);text-decoration:none;font-size:.875rem;padding:.4rem .75rem;border-radius:6px;transition:all .2s}
.nav-links a:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nav-btn{padding:.45rem 1.2rem;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;text-decoration:none;transition:all .25s}
.btn-outline{border:1px solid var(--border);color:var(--teal);background:transparent}
.btn-outline:hover{background:var(--teal-dim);box-shadow:0 0 20px var(--teal-glow)}
.btn-teal{background:var(--teal);color:var(--midnight);border:none;font-weight:700}
.btn-teal:hover{background:var(--emerald);box-shadow:0 0 24px var(--teal-glow)}

.auth-page{flex:1;display:flex;align-items:center;justify-content:center;padding:7rem 1.5rem 3rem;position:relative;overflow:hidden}
.bg-orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(80px);opacity:.2}
.bg-orb-1{width:600px;height:600px;background:var(--teal);top:-250px;left:50%;transform:translateX(-50%)}
.bg-orb-2{width:250px;height:250px;background:var(--emerald);bottom:-80px;left:-80px}

.auth-card{
  width:100%;max-width:480px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:2.75rem;position:relative;z-index:1;
  box-shadow:0 24px 80px rgba(0,0,0,.5);
  animation:slideUp .5s ease both;
}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.auth-card::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,var(--teal),transparent)}

.auth-header{text-align:center;margin-bottom:1.75rem}
.auth-icon{width:56px;height:56px;background:var(--teal-dim);border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;font-size:1.6rem;box-shadow:0 0 30px var(--teal-glow)}
.auth-header h1{font-family:'Clash Display',sans-serif;font-size:1.7rem;font-weight:700}
.auth-header p{color:var(--muted);font-size:.875rem;margin-top:.4rem}

.perks{display:flex;gap:.6rem;margin-bottom:1.5rem;flex-wrap:wrap}
.perk{display:flex;align-items:center;gap:.35rem;font-size:.78rem;color:var(--muted);background:var(--surface-2);padding:.3rem .7rem;border-radius:20px;border:1px solid var(--border-dim)}
.perk .tick{color:var(--teal);font-weight:700}

.name-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-group{margin-bottom:1.2rem}
.form-group label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:.5rem;letter-spacing:.06em;text-transform:uppercase}
.form-group input,.form-group select{
  width:100%;padding:.78rem 1rem;background:var(--surface-2);border:1px solid var(--border-dim);border-radius:10px;
  color:var(--text);font-size:.95rem;font-family:'Satoshi',sans-serif;outline:none;transition:border-color .2s,box-shadow .2s;
}
.form-group input:focus,.form-group select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,212,180,.1)}
.form-group input::placeholder{color:var(--muted-2)}
.form-group select option{background:var(--surface-3)}

.terms{font-size:.8rem;color:var(--muted);margin-bottom:1.5rem}
.terms a{color:var(--teal);text-decoration:none}

.btn-submit{
  width:100%;padding:.9rem;
  background:linear-gradient(135deg,var(--teal),var(--emerald));
  color:var(--midnight);border:none;border-radius:10px;
  font-family:'Clash Display',sans-serif;font-size:1rem;font-weight:700;
  cursor:pointer;transition:all .25s;
  box-shadow:0 4px 24px rgba(15,212,180,.3);
}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(15,212,180,.5)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
.auth-footer{text-align:center;margin-top:1.5rem;font-size:.875rem;color:var(--muted)}
.auth-footer a{color:var(--teal);text-decoration:none;font-weight:600}

.alert{padding:.78rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:.875rem;display:none}
.alert.error{background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.3);color:#ff8fa3}
.alert.success{background:rgba(0,229,160,.1);border:1px solid rgba(0,229,160,.3);color:#6ef2d0}
.alert.show{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--midnight);border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){nav{padding:0 1rem}.auth-card{padding:2rem 1.5rem}.name-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="nav-scene">
<nav>
  <a href="index.html" class="nav-logo">⚡ Maxi Capital</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="index.html#programs">Programs</a>
    <a href="login.html"     class="nav-btn btn-outline" id="navLogin">Login</a>
    <a href="signup.html"    class="nav-btn btn-teal"    id="navSignup">Sign Up</a>
    <a href="dashboard.html" class="nav-btn btn-outline" id="navDashboard" style="display:none">Dashboard</a>
    <a href="profile.html"   class="nav-btn btn-teal"    id="navProfile"   style="display:none">Profile</a>
  </div>
</nav>
</div>

<div class="auth-page">
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🚀</div>
      <h1>Create Account</h1>
      <p>Join 2,400+ traders already earning with Maxi Capital</p>
    </div>

    <div class="perks">
      <div class="perk"><span class="tick">✓</span> Free to register</div>
      <div class="perk"><span class="tick">✓</span> Instant dashboard</div>
      <div class="perk"><span class="tick">✓</span> Real-time tracking</div>
    </div>

    <div class="alert error"   id="alertError"></div>
    <div class="alert success" id="alertSuccess"></div>

    <div class="name-row">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" id="firstName" placeholder="John"/>
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="lastName" placeholder="Doe"/>
      </div>
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="trader@example.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>Country</label>
      <select id="country">
        <option value="">Select your country…</option>
        <option>Kenya</option><option>Nigeria</option><option>South Africa</option>
        <option>Ghana</option><option>Uganda</option><option>Tanzania</option>
        <option>United States</option><option>United Kingdom</option>
        <option>Canada</option><option>Australia</option><option>India</option><option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password"/>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Repeat password" autocomplete="new-password"/>
    </div>
    <div class="terms">
      By signing up you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </div>
    <button class="btn-submit" id="signupBtn" onclick="handleSignup()">Create My Account →</button>
    <div class="auth-footer">
      Already have an account? <a href="login.html">Login →</a>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp }                                   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged,
         createUserWithEmailAndPassword, updateProfile }   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp }      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const cfg = {
  apiKey:"AIzaSyDaKGU5Nrtof0lA7GwZN9baIwdpVZaftbQ",
  authDomain:"the-funded.firebaseapp.com",projectId:"the-funded",
  storageBucket:"the-funded.firebasestorage.app",
  messagingSenderId:"656425279116",appId:"1:656425279116:web:d309fc0a731066f28225a9"
};
const app  = initializeApp(cfg);
const auth = getAuth(app);
const db   = getFirestore(app);

// Update nav if already logged in
onAuthStateChanged(auth, user => {
  if (user) { window.location.replace('dashboard.html'); return; }
});

window.handleSignup = async () => {
  const firstName = document.getElementById('firstName').value.trim();
  const lastName  = document.getElementById('lastName').value.trim();
  const email     = document.getElementById('email').value.trim();
  const country   = document.getElementById('country').value;
  const password  = document.getElementById('password').value;
  const confirm   = document.getElementById('confirmPassword').value;
  const btn       = document.getElementById('signupBtn');
  const errEl     = document.getElementById('alertError');
  const okEl      = document.getElementById('alertSuccess');

  errEl.classList.remove('show'); okEl.classList.remove('show');

  if (!firstName || !lastName || !email || !password || !confirm) {
    errEl.textContent = 'Please fill in all fields.'; errEl.classList.add('show'); return;
  }
  if (password.length < 8) {
    errEl.textContent = 'Password must be at least 8 characters.'; errEl.classList.add('show'); return;
  }
  if (password !== confirm) {
    errEl.textContent = 'Passwords do not match.'; errEl.classList.add('show'); return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Creating account…';

  try {
    const { user } = await createUserWithEmailAndPassword(auth, email, password);

    // Update display name in Auth
    await updateProfile(user, { displayName: `${firstName} ${lastName}` });

    // ── CRITICAL FIX: Create Firestore profile immediately ──
    // Use setDoc with merge:true so it never fails silently on existing doc
    await setDoc(doc(db, 'users', user.uid), {
      uid:          user.uid,
      firstName,
      lastName,
      email:        user.email,
      country:      country || '',
      createdAt:    serverTimestamp(),
      totalPayout:  0,
      avatarUrl:    '',
    }, { merge: true });

    okEl.textContent = '✓ Account created! Redirecting to dashboard…';
    okEl.classList.add('show');
    setTimeout(() => window.location.replace('dashboard.html'), 1200);

  } catch (err) {
    const msgs = {
      'auth/email-already-in-use': 'An account with this email already exists.',
      'auth/invalid-email':        'Please enter a valid email address.',
      'auth/weak-password':        'Password is too weak.',
    };
    errEl.textContent = msgs[err.code] || `Signup failed: ${err.message}`;
    errEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Create My Account →';
  }
};
</script>
</body>
</html>
