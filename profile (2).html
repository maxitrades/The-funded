<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile – The Funded Traders</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #c9a84c; --gold-light: #e8c97a; --gold-dim: rgba(201,168,76,0.15);
      --dark: #0a0c0f; --dark-2: #111418; --dark-3: #181c22; --dark-4: #1e242c;
      --border: rgba(201,168,76,0.18); --border-dim: rgba(255,255,255,0.06);
      --text: #e8eaf0; --muted: #7a8190; --muted-2: #4a5060;
      --green: #22c55e; --red: #ef4444;
      --sidebar-w: 240px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; }

    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w);
      background: var(--dark-2); border-right: 1px solid var(--border-dim);
      display: flex; flex-direction: column; z-index: 200; overflow-y: auto;
    }
    .sidebar-logo { padding: 1.5rem 1.5rem 1rem; font-family: 'Syne', sans-serif; font-size: 1.15rem; font-weight: 800; color: var(--gold); text-decoration: none; display: block; border-bottom: 1px solid var(--border-dim); }
    .sidebar-section { padding: 1rem 1rem 0; }
    .sidebar-section-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.1em; color: var(--muted-2); text-transform: uppercase; padding: 0 0.5rem; margin-bottom: 0.5rem; }
    .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 0.75rem; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 0.9rem; transition: all 0.15s; cursor: pointer; border: none; background: none; width: 100%; margin-bottom: 2px; }
    .nav-item:hover { background: var(--dark-3); color: var(--text); }
    .nav-item.active { background: var(--gold-dim); color: var(--gold); }
    .nav-item .icon { font-size: 1.1rem; width: 20px; text-align: center; }
    .sidebar-bottom { margin-top: auto; padding: 1rem; border-top: 1px solid var(--border-dim); }
    .user-pill { display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem; border-radius: 8px; background: var(--dark-3); margin-bottom: 0.5rem; }
    .user-avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--dark)); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; color: var(--dark); flex-shrink: 0; }
    .user-info { overflow: hidden; }
    .user-name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: 0.72rem; color: var(--muted); }
    .logout-btn { width: 100%; padding: 0.6rem; border: 1px solid var(--border-dim); background: transparent; color: var(--muted); border-radius: 6px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
    .logout-btn:hover { border-color: var(--red); color: var(--red); background: rgba(239,68,68,0.1); }

    .main { margin-left: var(--sidebar-w); min-height: 100vh; }
    .topbar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 60px; background: rgba(10,12,15,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-dim); }
    .topbar-title { font-family: 'Syne', sans-serif; font-size: 1.05rem; font-weight: 700; }

    .content { padding: 2rem; max-width: 780px; }

    /* Profile Hero */
    .profile-hero {
      background: var(--dark-2); border: 1px solid var(--border-dim);
      border-radius: 16px; padding: 2rem; margin-bottom: 1.5rem;
      display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
      position: relative; overflow: hidden;
    }
    .profile-hero::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .profile-avatar-large {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #4a3800);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 700; color: var(--dark);
      border: 3px solid var(--border); flex-shrink: 0;
      font-family: 'Syne', sans-serif;
    }
    .profile-hero-info { flex: 1; }
    .profile-hero-name { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; }
    .profile-hero-email { color: var(--muted); font-size: 0.9rem; margin-top: 0.2rem; }
    .profile-hero-meta { display: flex; gap: 1.5rem; margin-top: 0.75rem; flex-wrap: wrap; }
    .profile-hero-meta span { font-size: 0.82rem; color: var(--muted); }
    .profile-hero-meta strong { color: var(--gold); }

    /* Sections */
    .profile-section {
      background: var(--dark-2); border: 1px solid var(--border-dim);
      border-radius: 12px; overflow: hidden; margin-bottom: 1.25rem;
    }
    .section-header {
      padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-dim);
      display: flex; align-items: center; justify-content: space-between;
    }
    .section-header h3 { font-family: 'Syne', sans-serif; font-size: 0.95rem; font-weight: 700; }
    .section-body { padding: 1.5rem; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.45rem; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }
    .form-group input, .form-group select {
      padding: 0.7rem 0.9rem;
      background: var(--dark-3); border: 1px solid var(--border-dim);
      border-radius: 8px; color: var(--text); font-size: 0.9rem;
      font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--gold); }
    .form-group input:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-group select option { background: var(--dark-3); }

    .save-btn {
      padding: 0.7rem 2rem; background: var(--gold); color: var(--dark);
      border: none; border-radius: 8px; font-family: 'Syne', sans-serif;
      font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
    }
    .save-btn:hover { background: var(--gold-light); }
    .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Password */
    .danger-zone { border-color: rgba(239,68,68,0.2); }
    .danger-zone .section-header { background: rgba(239,68,68,0.05); }
    .danger-zone h3 { color: var(--red); }

    /* Account stats row */
    .account-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
    .acc-stat { text-align: center; padding: 1rem; background: var(--dark-3); border-radius: 10px; border: 1px solid var(--border-dim); }
    .acc-stat-val { font-size: 1.3rem; font-weight: 700; font-family: 'Syne', sans-serif; color: var(--gold); }
    .acc-stat-key { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }

    /* Toast */
    .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 0.85rem 1.25rem; background: var(--dark-2); border: 1px solid var(--border); border-radius: 10px; font-size: 0.875rem; z-index: 600; transform: translateY(100px); opacity: 0; transition: all 0.3s; max-width: 320px; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: rgba(34,197,94,0.4); color: var(--green); }
    .toast.error { border-color: rgba(239,68,68,0.4); color: var(--red); }

    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--dark); border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 5px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .main { margin-left: 0; }
      .form-grid { grid-template-columns: 1fr; }
      .account-stats { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<aside class="sidebar">
  <a href="index.html" class="sidebar-logo">⚡ THE FUNDED</a>
  <div class="sidebar-section">
    <div class="sidebar-section-label">Main</div>
    <a href="dashboard.html" class="nav-item"><span class="icon">📊</span> My Accounts</a>
    <a href="dashboard.html#payouts" class="nav-item"><span class="icon">💸</span> Payouts</a>
  </div>
  <div class="sidebar-section" style="margin-top:0.5rem">
    <div class="sidebar-section-label">Account</div>
    <a href="profile.html" class="nav-item active"><span class="icon">👤</span> Profile</a>
    <a href="challenges.html" class="nav-item"><span class="icon">🏆</span> Challenges</a>
    <a href="index.html" class="nav-item"><span class="icon">🌐</span> Website</a>
  </div>
  <div class="sidebar-bottom">
    <div class="user-pill">
      <div class="user-avatar" id="sidebarAvatar">?</div>
      <div class="user-info">
        <div class="user-name" id="sidebarName">Loading…</div>
        <div class="user-role">Trader</div>
      </div>
    </div>
    <button class="logout-btn" onclick="handleLogout()">Sign Out</button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-title">Profile Settings</div>
  </div>

  <div class="content" id="mainContent">
    <div style="padding:4rem;text-align:center;color:var(--muted)">
      <div style="width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem"></div>
      Loading profile…
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDaKGU5Nrtof0lA7GwZN9baIwdpVZaftbQ",
  authDomain: "the-funded.firebaseapp.com",
  projectId: "the-funded",
  storageBucket: "the-funded.firebasestorage.app",
  messagingSenderId: "656425279116",
  appId: "1:656425279116:web:d309fc0a731066f28225a9"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let userProfile = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  currentUser = user;
  await loadProfile();
});

async function loadProfile() {
  try {
    // Load profile — graceful fallback if doc doesn't exist yet
    const snap = await getDoc(doc(db, 'users', currentUser.uid));
    if (snap.exists()) {
      userProfile = snap.data();
    } else {
      const nameParts = (currentUser.displayName || '').split(' ');
      userProfile = {
        firstName: nameParts[0] || '',
        lastName: nameParts.slice(1).join(' ') || '',
        email: currentUser.email,
        country: '',
        totalPayout: 0,
      };
    }

    let accounts = [];
    let paidPayouts = [];

    try {
      const accountsQ = query(collection(db, 'accounts'), where('userId', '==', currentUser.uid));
      const accountsSnap = await getDocs(accountsQ);
      accounts = accountsSnap.docs.map(d => d.data());
    } catch(e) { console.warn('Accounts error:', e.message); }

    try {
      const payoutsQ = query(collection(db, 'payouts'), where('userId', '==', currentUser.uid));
      const payoutsSnap = await getDocs(payoutsQ);
      paidPayouts = payoutsSnap.docs.map(d=>d.data()).filter(p=>p.status==='paid');
    } catch(e) { console.warn('Payouts error:', e.message); }

    const initials = (((userProfile.firstName||currentUser.email)[0]) + ((userProfile.lastName||'')[0]||'')).toUpperCase() || '?';
    document.getElementById('sidebarAvatar').textContent = initials;
    document.getElementById('sidebarName').textContent = `${userProfile.firstName||''} ${userProfile.lastName||''}`.trim() || currentUser.email;

    const totalPayout = paidPayouts.reduce((s,p) => s+(p.amount||0), 0);
    const fundedCount = accounts.filter(a=>a.status==='funded').length;
    const joinDate = userProfile.createdAt ? new Date(userProfile.createdAt.seconds*1000).toLocaleDateString('en-US',{month:'long',year:'numeric'}) : 'N/A';

  document.getElementById('mainContent').innerHTML = `
    <!-- HERO -->
    <div class="profile-hero">
      <div class="profile-avatar-large">${initials}</div>
      <div class="profile-hero-info">
        <div class="profile-hero-name">${userProfile.firstName||''} ${userProfile.lastName||''}</div>
        <div class="profile-hero-email">${currentUser.email}</div>
        <div class="profile-hero-meta">
          <span>📅 Joined <strong>${joinDate}</strong></span>
          <span>🏆 <strong>${fundedCount}</strong> Funded Accounts</span>
          <span>💰 <strong>$${totalPayout.toLocaleString()}</strong> Paid Out</span>
          <span>🌍 <strong>${userProfile.country || 'N/A'}</strong></span>
        </div>
      </div>
    </div>

    <!-- STATS -->
    <div class="profile-section" style="margin-bottom:1.25rem">
      <div class="section-header"><h3>Account Overview</h3></div>
      <div class="section-body">
        <div class="account-stats">
          <div class="acc-stat">
            <div class="acc-stat-val">${accounts.length}</div>
            <div class="acc-stat-key">Total Accounts</div>
          </div>
          <div class="acc-stat">
            <div class="acc-stat-val">${fundedCount}</div>
            <div class="acc-stat-key">Funded</div>
          </div>
          <div class="acc-stat">
            <div class="acc-stat-val">$${totalPayout.toLocaleString()}</div>
            <div class="acc-stat-key">Total Paid Out</div>
          </div>
          <div class="acc-stat">
            <div class="acc-stat-val">${paidPayouts.length}</div>
            <div class="acc-stat-key">Payout Count</div>
          </div>
        </div>
      </div>
    </div>

    <!-- EDIT PROFILE -->
    <div class="profile-section">
      <div class="section-header">
        <h3>Personal Information</h3>
      </div>
      <div class="section-body">
        <div class="form-grid">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="pFirstName" value="${userProfile.firstName||''}" placeholder="First Name" />
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="pLastName" value="${userProfile.lastName||''}" placeholder="Last Name" />
          </div>
          <div class="form-group full">
            <label>Email Address</label>
            <input type="email" value="${currentUser.email}" disabled />
          </div>
          <div class="form-group">
            <label>Country</label>
            <select id="pCountry">
              <option value="">Select…</option>
              ${['Kenya','Nigeria','South Africa','Ghana','Uganda','Tanzania','United States','United Kingdom','Canada','Australia','India','Other'].map(c => `<option ${userProfile.country===c?'selected':''}>${c}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label>Phone (Optional)</label>
            <input type="tel" id="pPhone" value="${userProfile.phone||''}" placeholder="+1 234 567 8900" />
          </div>
          <div class="form-group full">
            <label>Bio (Optional)</label>
            <input type="text" id="pBio" value="${userProfile.bio||''}" placeholder="Short bio or trading style…" />
          </div>
        </div>
        <div style="margin-top:1.25rem">
          <button class="save-btn" id="saveProfileBtn" onclick="saveProfile()">Save Changes</button>
        </div>
      </div>
    </div>

    <!-- CHANGE PASSWORD -->
    <div class="profile-section danger-zone">
      <div class="section-header"><h3>Change Password</h3></div>
      <div class="section-body">
        <div class="form-grid">
          <div class="form-group full">
            <label>Current Password</label>
            <input type="password" id="currentPw" placeholder="••••••••" />
          </div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPw" placeholder="Min 8 characters" />
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPw" placeholder="Repeat new password" />
          </div>
        </div>
        <div style="margin-top:1.25rem">
          <button class="save-btn" style="background:var(--dark-3);color:var(--text);border:1px solid var(--border-dim)" id="changePwBtn" onclick="changePassword()">Update Password</button>
        </div>
      </div>
    </div>
  `;

  } catch(e) {
    console.error('Profile load error:', e);
    document.getElementById('mainContent').innerHTML = `
      <div style="text-align:center;padding:4rem;color:var(--muted)">
        <div style="font-size:2rem;margin-bottom:1rem">⚠️</div>
        <div style="font-size:1rem;color:var(--text);margin-bottom:0.5rem">Failed to load profile</div>
        <div style="font-size:0.85rem;margin-bottom:1.5rem">${e.message}</div>
        <button onclick="location.reload()" style="padding:0.6rem 1.5rem;background:var(--gold);color:var(--dark);border:none;border-radius:8px;font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;">Retry</button>
      </div>`;
  }
}

window.saveProfile = async function() {
  const btn = document.getElementById('saveProfileBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Saving…';
  try {
    const { setDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    await setDoc(doc(db, 'users', currentUser.uid), {
      firstName: document.getElementById('pFirstName').value.trim(),
      lastName: document.getElementById('pLastName').value.trim(),
      country: document.getElementById('pCountry').value,
      phone: document.getElementById('pPhone').value.trim(),
      bio: document.getElementById('pBio').value.trim(),
      email: currentUser.email,
      uid: currentUser.uid,
      updatedAt: serverTimestamp(),
    }, { merge: true });
    showToast('Profile updated successfully!', 'success');
    await loadProfile();
  } catch(e) {
    showToast('Failed to save: ' + e.message, 'error');
  }
  btn.disabled = false; btn.textContent = 'Save Changes';
};

window.changePassword = async function() {
  const currentPw = document.getElementById('currentPw').value;
  const newPw = document.getElementById('newPw').value;
  const confirmPw = document.getElementById('confirmPw').value;
  if (newPw !== confirmPw) { showToast('Passwords do not match.', 'error'); return; }
  if (newPw.length < 8) { showToast('Password must be at least 8 characters.', 'error'); return; }
  const btn = document.getElementById('changePwBtn');
  btn.disabled = true;
  try {
    const cred = EmailAuthProvider.credential(currentUser.email, currentPw);
    await reauthenticateWithCredential(currentUser, cred);
    await updatePassword(currentUser, newPw);
    showToast('Password changed successfully!', 'success');
    document.getElementById('currentPw').value = '';
    document.getElementById('newPw').value = '';
    document.getElementById('confirmPw').value = '';
  } catch(e) {
    const msgs = { 'auth/wrong-password': 'Current password is incorrect.', 'auth/weak-password': 'New password is too weak.' };
    showToast(msgs[e.code] || 'Failed to change password.', 'error');
  }
  btn.disabled = false;
};

window.handleLogout = async function() {
  await signOut(auth);
  window.location.href = 'index.html';
};

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.className = 'toast', 3500);
}
</script>
</body>
</html>
