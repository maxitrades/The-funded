<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – The Funded Traders</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #c9a84c; --gold-light: #e8c97a; --gold-dim: rgba(201,168,76,0.15);
      --dark: #0a0c0f; --dark-2: #111418; --dark-3: #181c22; --dark-4: #1e242c;
      --border: rgba(201,168,76,0.15); --border-dim: rgba(255,255,255,0.06);
      --text: #e8eaf0; --muted: #7a8190; --muted-2: #4a5060;
      --green: #22c55e; --green-dim: rgba(34,197,94,0.12);
      --red: #ef4444; --red-dim: rgba(239,68,68,0.12);
      --blue: #60a5fa; --blue-dim: rgba(96,165,250,0.12);
      --orange: #f97316; --orange-dim: rgba(249,115,22,0.12);
      --sidebar-w: 240px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; }

    /* ── SIDEBAR ── */
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: var(--sidebar-w);
      background: var(--dark-2);
      border-right: 1px solid var(--border-dim);
      display: flex; flex-direction: column;
      z-index: 200; overflow-y: auto;
    }
    .sidebar-logo {
      padding: 1.5rem 1.5rem 1rem;
      font-family: 'Syne', sans-serif; font-size: 1.15rem; font-weight: 800;
      color: var(--gold); text-decoration: none; display: block;
      border-bottom: 1px solid var(--border-dim);
    }
    .sidebar-section { padding: 1rem 1rem 0; }
    .sidebar-section-label {
      font-size: 0.68rem; font-weight: 600; letter-spacing: 0.1em;
      color: var(--muted-2); text-transform: uppercase; padding: 0 0.5rem;
      margin-bottom: 0.5rem;
    }
    .nav-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.65rem 0.75rem; border-radius: 8px;
      color: var(--muted); text-decoration: none; font-size: 0.9rem;
      transition: all 0.15s; cursor: pointer; border: none; background: none; width: 100%;
      margin-bottom: 2px;
    }
    .nav-item:hover { background: var(--dark-3); color: var(--text); }
    .nav-item.active { background: var(--gold-dim); color: var(--gold); }
    .nav-item .icon { font-size: 1.1rem; width: 20px; text-align: center; }
    .sidebar-bottom {
      margin-top: auto; padding: 1rem;
      border-top: 1px solid var(--border-dim);
    }
    .user-pill {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.65rem; border-radius: 8px;
      background: var(--dark-3); margin-bottom: 0.5rem;
    }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--dark));
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 700; color: var(--dark);
      flex-shrink: 0;
    }
    .user-info { overflow: hidden; }
    .user-name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: 0.72rem; color: var(--muted); }
    .logout-btn {
      width: 100%; padding: 0.6rem; border: 1px solid var(--border-dim);
      background: transparent; color: var(--muted); border-radius: 6px;
      font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .logout-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-dim); }

    /* ── MAIN ── */
    .main { margin-left: var(--sidebar-w); min-height: 100vh; }

    .topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem; height: 60px;
      background: rgba(10,12,15,0.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-dim);
    }
    .topbar-title { font-family: 'Syne', sans-serif; font-size: 1.05rem; font-weight: 700; }
    .topbar-right { display: flex; align-items: center; gap: 1rem; }
    .topbar-greeting { font-size: 0.85rem; color: var(--muted); }
    .btn-buy {
      padding: 0.5rem 1.2rem; border-radius: 6px;
      background: var(--gold); color: var(--dark);
      border: none; font-family: 'Syne', sans-serif;
      font-size: 0.85rem; font-weight: 700; cursor: pointer;
      text-decoration: none; transition: all 0.2s;
    }
    .btn-buy:hover { background: var(--gold-light); }

    .content { padding: 2rem; }

    /* TABS */
    .tab-bar {
      display: flex; gap: 0.25rem; margin-bottom: 2rem;
      background: var(--dark-2); padding: 4px; border-radius: 10px;
      width: fit-content; border: 1px solid var(--border-dim);
    }
    .tab-btn {
      padding: 0.5rem 1.2rem; border-radius: 7px;
      border: none; background: transparent;
      color: var(--muted); font-size: 0.875rem; font-family: 'DM Sans', sans-serif;
      cursor: pointer; transition: all 0.2s;
    }
    .tab-btn.active { background: var(--dark-4); color: var(--text); }

    /* STAT CARDS */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card {
      background: var(--dark-2); border: 1px solid var(--border-dim);
      border-radius: 12px; padding: 1.25rem;
    }
    .stat-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.5rem; }
    .stat-value { font-family: 'DM Mono', monospace; font-size: 1.5rem; font-weight: 500; }
    .stat-sub { font-size: 0.78rem; margin-top: 0.3rem; }
    .text-green { color: var(--green); }
    .text-red { color: var(--red); }
    .text-gold { color: var(--gold); }
    .text-muted { color: var(--muted); }

    /* ACCOUNT CARDS */
    .accounts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.25rem; }

    .account-card {
      background: var(--dark-2); border: 1px solid var(--border-dim);
      border-radius: 14px; overflow: hidden; transition: border-color 0.2s;
    }
    .account-card:hover { border-color: var(--border); }

    .account-header {
      padding: 1.25rem 1.25rem 1rem;
      border-bottom: 1px solid var(--border-dim);
      display: flex; align-items: flex-start; justify-content: space-between;
    }
    .account-type { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; }
    .account-size { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; }
    .badge {
      padding: 0.25rem 0.65rem; border-radius: 20px;
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em;
    }
    .badge-phase1 { background: var(--blue-dim); color: var(--blue); }
    .badge-phase2 { background: var(--orange-dim); color: var(--orange); }
    .badge-funded { background: var(--green-dim); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    .badge-failed { background: var(--red-dim); color: var(--red); }
    .badge-review { background: var(--gold-dim); color: var(--gold); }

    .account-body { padding: 1.25rem; }

    /* Progress bar */
    .metric-row { margin-bottom: 1rem; }
    .metric-head { display: flex; justify-content: space-between; margin-bottom: 0.35rem; }
    .metric-label { font-size: 0.78rem; color: var(--muted); }
    .metric-value { font-family: 'DM Mono', monospace; font-size: 0.82rem; }
    .progress-bar { height: 6px; background: var(--dark-4); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
    .fill-green { background: linear-gradient(90deg, #16a34a, var(--green)); }
    .fill-gold { background: linear-gradient(90deg, #a37a28, var(--gold)); }
    .fill-red { background: linear-gradient(90deg, #b91c1c, var(--red)); }
    .fill-blue { background: linear-gradient(90deg, #2563eb, var(--blue)); }

    .account-meta {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem;
      margin-top: 1rem; padding-top: 1rem;
      border-top: 1px solid var(--border-dim);
    }
    .meta-item {}
    .meta-key { font-size: 0.72rem; color: var(--muted-2); text-transform: uppercase; letter-spacing: 0.05em; }
    .meta-val { font-family: 'DM Mono', monospace; font-size: 0.85rem; margin-top: 0.15rem; }

    .account-footer {
      padding: 0.85rem 1.25rem;
      border-top: 1px solid var(--border-dim);
      display: flex; gap: 0.5rem;
    }
    .acc-btn {
      flex: 1; padding: 0.5rem; border-radius: 6px;
      font-size: 0.8rem; font-family: 'DM Sans', sans-serif;
      cursor: pointer; transition: all 0.2s; text-align: center;
      text-decoration: none;
    }
    .acc-btn-outline { border: 1px solid var(--border-dim); background: transparent; color: var(--muted); }
    .acc-btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .acc-btn-gold { background: var(--gold-dim); color: var(--gold); border: 1px solid rgba(201,168,76,0.3); }
    .acc-btn-gold:hover { background: var(--gold); color: var(--dark); }

    /* EMPTY STATE */
    .empty-state {
      text-align: center; padding: 4rem 2rem;
      background: var(--dark-2); border: 1px dashed var(--border);
      border-radius: 16px;
    }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-title { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem; }
    .empty-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; max-width: 360px; margin-left: auto; margin-right: auto; }

    /* PAYOUT HISTORY */
    .table-wrap { background: var(--dark-2); border: 1px solid var(--border-dim); border-radius: 12px; overflow: hidden; }
    .table-head { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; padding: 0.75rem 1.25rem; background: var(--dark-3); }
    .table-head span { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
    .table-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; padding: 0.9rem 1.25rem; border-top: 1px solid var(--border-dim); align-items: center; }
    .table-row:hover { background: var(--dark-3); }
    .table-row span { font-size: 0.875rem; }
    .table-empty { padding: 2rem; text-align: center; color: var(--muted); font-size: 0.875rem; }

    /* LOADING */
    .loading-state { text-align: center; padding: 4rem; color: var(--muted); }
    .loading-spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Section title */
    .section-title { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; }
    .section-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }

    /* Payout request modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 500; display: none; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--dark-2); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; max-width: 420px; width: 90%; }
    .modal h2 { font-family: 'Syne', sans-serif; font-size: 1.3rem; margin-bottom: 0.5rem; }
    .modal p { color: var(--muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
    .modal-input { width: 100%; padding: 0.75rem 1rem; background: var(--dark-3); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; font-family: 'DM Sans', sans-serif; outline: none; margin-bottom: 1rem; }
    .modal-input:focus { border-color: var(--gold); }
    .modal-btns { display: flex; gap: 0.75rem; }
    .modal-cancel { flex: 1; padding: 0.7rem; border: 1px solid var(--border-dim); background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .modal-confirm { flex: 1; padding: 0.7rem; background: var(--gold); color: var(--dark); border: none; border-radius: 8px; font-family: 'Syne', sans-serif; font-weight: 700; cursor: pointer; }

    /* TOAST */
    .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 0.85rem 1.25rem; background: var(--dark-2); border: 1px solid var(--border); border-radius: 10px; font-size: 0.875rem; z-index: 600; transform: translateY(100px); opacity: 0; transition: all 0.3s; max-width: 320px; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: rgba(34,197,94,0.4); color: var(--green); }
    .toast.error { border-color: rgba(239,68,68,0.4); color: var(--red); }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .topbar { padding: 0 1rem; }
      .content { padding: 1rem; }
      .stats-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <a href="index.html" class="sidebar-logo">⚡ THE FUNDED</a>

  <div class="sidebar-section">
    <div class="sidebar-section-label">Main</div>
    <button class="nav-item active" onclick="showTab('accounts')">
      <span class="icon">📊</span> My Accounts
    </button>
    <button class="nav-item" onclick="showTab('payouts')">
      <span class="icon">💸</span> Payouts
    </button>
    <button class="nav-item" onclick="showTab('overview')">
      <span class="icon">📈</span> Overview
    </button>
  </div>

  <div class="sidebar-section" style="margin-top:0.5rem">
    <div class="sidebar-section-label">Account</div>
    <a href="profile.html" class="nav-item"><span class="icon">👤</span> Profile</a>
    <a href="challenges.html" class="nav-item"><span class="icon">🏆</span> Challenges</a>
    <a href="index.html" class="nav-item"><span class="icon">🌐</span> Website</a>
  </div>

  <div class="sidebar-bottom">
    <div class="user-pill">
      <div class="user-avatar" id="sidebarAvatar">?</div>
      <div class="user-info">
        <div class="user-name" id="sidebarName">Loading…</div>
        <div class="user-role">Trader</div>
      </div>
    </div>
    <button class="logout-btn" onclick="handleLogout()">Sign Out</button>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbarTitle">My Accounts</div>
    <div class="topbar-right">
      <span class="topbar-greeting" id="topbarGreeting"></span>
      <a href="challenges.html" class="btn-buy">+ Buy Account</a>
    </div>
  </div>

  <div class="content" id="mainContent">
    <div class="loading-state">
      <div class="loading-spinner"></div>
      <p>Loading your dashboard…</p>
    </div>
  </div>
</div>

<!-- PAYOUT MODAL -->
<div class="modal-overlay" id="payoutModal">
  <div class="modal">
    <h2>Request Payout 💸</h2>
    <p>Enter the amount you wish to withdraw. Minimum payout is $100. Processed within 48 hours.</p>
    <input class="modal-input" type="number" id="payoutAmount" placeholder="Amount (USD)" min="100" />
    <input class="modal-input" type="text" id="payoutWallet" placeholder="Wallet address or bank details" />
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-confirm" onclick="submitPayout()">Confirm Request</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, collection, query, where,
  getDocs, orderBy, addDoc, serverTimestamp, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDaKGU5Nrtof0lA7GwZN9baIwdpVZaftbQ",
  authDomain: "the-funded.firebaseapp.com",
  projectId: "the-funded",
  storageBucket: "the-funded.firebasestorage.app",
  messagingSenderId: "656425279116",
  appId: "1:656425279116:web:d309fc0a731066f28225a9"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

let currentUser = null;
let userProfile = null;
let userAccounts = [];
let payouts = [];

/* ── AUTH GATE ── */
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  currentUser = user;
  await loadUserData();
});

async function loadUserData() {
  try {
    const profileSnap = await getDoc(doc(db, 'users', currentUser.uid));
    if (profileSnap.exists()) {
      userProfile = profileSnap.data();
    } else {
      // Fallback profile if doc missing
      userProfile = { firstName: currentUser.displayName?.split(' ')[0] || 'Trader', lastName: '' };
    }

    // Load accounts
    const accountsQ = query(collection(db, 'accounts'), where('userId', '==', currentUser.uid));
    const accountsSnap = await getDocs(accountsQ);
    userAccounts = accountsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    // Load payouts
    const payoutsQ = query(collection(db, 'payouts'), where('userId', '==', currentUser.uid), orderBy('createdAt', 'desc'));
    const payoutsSnap = await getDocs(payoutsQ);
    payouts = payoutsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

  } catch (e) {
    console.error(e);
  }

  renderSidebar();
  showTab('accounts');
}

function renderSidebar() {
  const name = userProfile?.firstName || currentUser.displayName?.split(' ')[0] || 'Trader';
  const initials = (userProfile?.firstName?.[0] || '?') + (userProfile?.lastName?.[0] || '');
  document.getElementById('sidebarName').textContent = `${userProfile?.firstName || ''} ${userProfile?.lastName || ''}`.trim() || currentUser.email;
  document.getElementById('sidebarAvatar').textContent = initials.toUpperCase() || '?';
  document.getElementById('topbarGreeting').textContent = `Hey, ${name} 👋`;
}

/* ── TABS ── */
window.showTab = function(tab) {
  // update sidebar active
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const tabMap = { accounts: 0, payouts: 1, overview: 2 };
  document.querySelectorAll('.nav-item')[tabMap[tab]]?.classList.add('active');

  const titles = { accounts: 'My Accounts', payouts: 'Payout History', overview: 'Overview' };
  document.getElementById('topbarTitle').textContent = titles[tab];

  if (tab === 'accounts') renderAccounts();
  if (tab === 'payouts') renderPayouts();
  if (tab === 'overview') renderOverview();
};

/* ── ACCOUNTS TAB ── */
function renderAccounts() {
  const mc = document.getElementById('mainContent');
  if (userAccounts.length === 0) {
    mc.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📭</div>
        <div class="empty-title">No Accounts Yet</div>
        <p class="empty-sub">You haven't purchased a challenge yet. Pick a program and start your journey to getting funded.</p>
        <a href="challenges.html" class="btn-buy" style="display:inline-block;padding:0.75rem 2rem;border-radius:8px;font-family:'Syne',sans-serif;font-size:0.95rem;font-weight:700;background:var(--gold);color:var(--dark);text-decoration:none;">Browse Challenges →</a>
      </div>`;
    return;
  }

  const totalBalance = userAccounts.reduce((s, a) => s + (a.currentBalance || a.accountSize || 0), 0);
  const totalProfit  = userAccounts.reduce((s, a) => s + (a.profit || 0), 0);
  const fundedCount  = userAccounts.filter(a => a.status === 'funded').length;

  mc.innerHTML = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Accounts</div>
        <div class="stat-value">${userAccounts.length}</div>
        <div class="stat-sub text-muted">${fundedCount} funded</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Balance</div>
        <div class="stat-value text-gold">$${totalBalance.toLocaleString()}</div>
        <div class="stat-sub text-muted">across all accounts</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Profit</div>
        <div class="stat-value ${totalProfit >= 0 ? 'text-green' : 'text-red'}">
          ${totalProfit >= 0 ? '+' : ''}$${totalProfit.toLocaleString()}
        </div>
        <div class="stat-sub text-muted">all time</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Payouts</div>
        <div class="stat-value text-gold">$${(userProfile?.totalPayout || 0).toLocaleString()}</div>
        <div class="stat-sub text-muted">paid out</div>
      </div>
    </div>

    <div class="section-row">
      <div class="section-title">Active Accounts</div>
    </div>

    <div class="accounts-grid" id="accountsGrid">
      ${userAccounts.map(a => renderAccountCard(a)).join('')}
    </div>`;
}

function renderAccountCard(acc) {
  const size    = acc.accountSize || 10000;
  const balance = acc.currentBalance || size;
  const profit  = acc.profit || 0;
  const profitPct = ((profit / size) * 100).toFixed(2);

  const targets = { 'The Accelerator': 10, 'The Endurance': 8, 'The Elite Path': 12 };
  const target  = targets[acc.programType] || 10;
  const targetAmt = size * (target / 100);
  const progressPct = Math.min(100, Math.max(0, (profit / targetAmt) * 100));

  // Drawdown
  const maxDD = acc.maxDrawdown || 10;
  const dailyDD = acc.dailyDrawdown || 5;
  const currentMaxDD = acc.currentMaxDD || 0;
  const currentDailyDD = acc.currentDailyDD || 0;
  const maxDDPct = Math.min(100, (currentMaxDD / maxDD) * 100);
  const dailyDDPct = Math.min(100, (currentDailyDD / dailyDD) * 100);

  const badges = {
    'phase1':  '<span class="badge badge-phase1">Phase 1</span>',
    'phase2':  '<span class="badge badge-phase2">Phase 2</span>',
    'funded':  '<span class="badge badge-funded">● Funded</span>',
    'failed':  '<span class="badge badge-failed">Failed</span>',
    'review':  '<span class="badge badge-review">In Review</span>',
  };
  const badge = badges[acc.status] || badges['phase1'];
  const isProfit = profit >= 0;

  return `
    <div class="account-card">
      <div class="account-header">
        <div>
          <div class="account-type">${acc.programType || 'Challenge'}</div>
          <div class="account-size">$${size.toLocaleString()} Account · ${acc.broker || 'MT5'}</div>
        </div>
        ${badge}
      </div>
      <div class="account-body">

        <div class="metric-row">
          <div class="metric-head">
            <span class="metric-label">Profit Progress (Target: ${target}%)</span>
            <span class="metric-value ${isProfit ? 'text-green' : 'text-red'}">${isProfit ? '+' : ''}$${profit.toLocaleString()} (${isProfit ? '+' : ''}${profitPct}%)</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill fill-green" style="width:${progressPct}%"></div>
          </div>
        </div>

        <div class="metric-row">
          <div class="metric-head">
            <span class="metric-label">Max Drawdown Used (${maxDD}% limit)</span>
            <span class="metric-value ${maxDDPct > 70 ? 'text-red' : 'text-muted'}">${currentMaxDD.toFixed(1)}%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill ${maxDDPct > 70 ? 'fill-red' : 'fill-gold'}" style="width:${maxDDPct}%"></div>
          </div>
        </div>

        <div class="metric-row">
          <div class="metric-head">
            <span class="metric-label">Daily Drawdown (${dailyDD}% limit)</span>
            <span class="metric-value ${dailyDDPct > 70 ? 'text-red' : 'text-muted'}">${currentDailyDD.toFixed(1)}%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill ${dailyDDPct > 70 ? 'fill-red' : 'fill-gold'}" style="width:${dailyDDPct}%"></div>
          </div>
        </div>

        <div class="account-meta">
          <div class="meta-item">
            <div class="meta-key">Balance</div>
            <div class="meta-val">$${balance.toLocaleString()}</div>
          </div>
          <div class="meta-item">
            <div class="meta-key">Win Rate</div>
            <div class="meta-val">${acc.winRate || 0}%</div>
          </div>
          <div class="meta-item">
            <div class="meta-key">Trading Days</div>
            <div class="meta-val">${acc.tradingDays || 0}</div>
          </div>
          <div class="meta-item">
            <div class="meta-key">Started</div>
            <div class="meta-val">${acc.startDate ? new Date(acc.startDate.seconds ? acc.startDate.seconds*1000 : acc.startDate).toLocaleDateString() : 'N/A'}</div>
          </div>
          <div class="meta-item">
            <div class="meta-key">Account ID</div>
            <div class="meta-val" style="font-size:0.72rem">${acc.accountId || acc.id.slice(0,8).toUpperCase()}</div>
          </div>
          <div class="meta-item">
            <div class="meta-key">Profit Split</div>
            <div class="meta-val text-gold">${acc.profitSplit || 80}%</div>
          </div>
        </div>
      </div>
      <div class="account-footer">
        ${acc.status === 'funded' ? `<button class="acc-btn acc-btn-gold" onclick="openPayoutModal('${acc.id}')">Request Payout</button>` : ''}
        <button class="acc-btn acc-btn-outline" onclick="viewTrades('${acc.id}')">View Trades</button>
      </div>
    </div>`;
}

/* ── PAYOUTS TAB ── */
function renderPayouts() {
  const mc = document.getElementById('mainContent');
  const totalPaid = payouts.filter(p => p.status === 'paid').reduce((s, p) => s + (p.amount || 0), 0);
  const pending = payouts.filter(p => p.status === 'pending');

  mc.innerHTML = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Paid Out</div>
        <div class="stat-value text-green">$${totalPaid.toLocaleString()}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending Requests</div>
        <div class="stat-value text-gold">${pending.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">All Payouts</div>
        <div class="stat-value">${payouts.length}</div>
      </div>
    </div>

    <div class="section-title">Payout History</div>
    <div class="table-wrap">
      <div class="table-head">
        <span>Date</span><span>Account</span><span>Amount</span><span>Method</span><span>Status</span>
      </div>
      ${payouts.length === 0
        ? '<div class="table-empty">No payouts yet. Keep trading and reach your profit target!</div>'
        : payouts.map(p => {
          const date = p.createdAt ? new Date(p.createdAt.seconds * 1000).toLocaleDateString() : 'N/A';
          const statusColors = { paid: 'text-green', pending: 'text-gold', rejected: 'text-red' };
          return `<div class="table-row">
            <span>${date}</span>
            <span class="text-muted">${(p.accountId || '').slice(0,8).toUpperCase()}</span>
            <span class="text-gold">$${(p.amount || 0).toLocaleString()}</span>
            <span class="text-muted">${p.method || 'Crypto'}</span>
            <span class="${statusColors[p.status] || 'text-muted'}">${p.status?.charAt(0).toUpperCase() + p.status?.slice(1) || 'Pending'}</span>
          </div>`;
        }).join('')
      }
    </div>`;
}

/* ── OVERVIEW TAB ── */
function renderOverview() {
  const mc = document.getElementById('mainContent');
  const fundedAccs = userAccounts.filter(a => a.status === 'funded');
  const phase1 = userAccounts.filter(a => a.status === 'phase1');
  const phase2 = userAccounts.filter(a => a.status === 'phase2');

  mc.innerHTML = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Funded Accounts</div>
        <div class="stat-value text-green">${fundedAccs.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">In Phase 1</div>
        <div class="stat-value text-blue">${phase1.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">In Phase 2</div>
        <div class="stat-value" style="color:var(--orange)">${phase2.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Capital</div>
        <div class="stat-value text-gold">$${userAccounts.reduce((s,a)=>s+(a.accountSize||0),0).toLocaleString()}</div>
      </div>
    </div>

    <div class="section-title" style="margin-bottom:1rem">Account Summary</div>
    <div style="background:var(--dark-2);border:1px solid var(--border-dim);border-radius:12px;overflow:hidden">
      ${userAccounts.length === 0 ? '<div class="table-empty">No accounts purchased yet.</div>' :
        userAccounts.map(a => {
          const badges = { phase1:'🔵', phase2:'🟠', funded:'🟢', failed:'🔴', review:'🟡' };
          return `<div class="table-row" style="grid-template-columns:2fr 1fr 1fr 1fr 1fr">
            <span>${a.programType || 'Challenge'}</span>
            <span class="text-gold">$${(a.accountSize||0).toLocaleString()}</span>
            <span>${badges[a.status]||'🔵'} ${a.status||'phase1'}</span>
            <span class="${(a.profit||0)>=0?'text-green':'text-red'}">${(a.profit||0)>=0?'+':''}$${(a.profit||0).toLocaleString()}</span>
            <span class="text-muted">${a.winRate||0}% WR</span>
          </div>`;
        }).join('')
      }
    </div>`;
}

/* ── ACTIONS ── */
window.handleLogout = async function () {
  await signOut(auth);
  window.location.href = 'index.html';
};

let activePayoutAccountId = null;
window.openPayoutModal = function(accountId) {
  activePayoutAccountId = accountId;
  document.getElementById('payoutModal').classList.add('open');
};
window.closeModal = function() {
  document.getElementById('payoutModal').classList.remove('open');
};

window.submitPayout = async function () {
  const amount = parseFloat(document.getElementById('payoutAmount').value);
  const wallet = document.getElementById('payoutWallet').value.trim();
  if (!amount || amount < 100) { showToast('Minimum payout is $100.', 'error'); return; }
  if (!wallet) { showToast('Please enter your wallet/bank details.', 'error'); return; }

  try {
    await addDoc(collection(db, 'payouts'), {
      userId: currentUser.uid,
      accountId: activePayoutAccountId,
      amount, wallet, status: 'pending',
      createdAt: serverTimestamp(),
    });
    closeModal();
    showToast('Payout request submitted! Processed within 48h.', 'success');
    // Reload
    const payoutsQ = query(collection(db, 'payouts'), where('userId', '==', currentUser.uid), orderBy('createdAt', 'desc'));
    const payoutsSnap = await getDocs(payoutsQ);
    payouts = payoutsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) {
    showToast('Failed to submit request. Try again.', 'error');
  }
};

window.viewTrades = function(accountId) {
  showToast('Trade history coming soon!', '');
};

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.className = 'toast', 3500);
}
</script>

</body>
</html>
