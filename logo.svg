<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#F0D060"/>
      <stop offset="100%" style="stop-color:#A08020"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a22"/>
      <stop offset="100%" style="stop-color:#0a0a10"/>
    </linearGradient>
  </defs>
  <!-- Shield icon -->
  <path d="M10 8 L30 4 L50 8 L50 28 C50 40 30 50 30 50 C30 50 10 40 10 28 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <!-- Chart bars inside shield -->
  <rect x="16" y="32" width="5" height="12" rx="1" fill="url(#goldGrad)" opacity="0.9"/>
  <rect x="24" y="24" width="5" height="20" rx="1" fill="url(#goldGrad)"/>
  <rect x="32" y="18" width="5" height="26" rx="1" fill="url(#goldGrad)" opacity="0.9"/>
  <rect x="40" y="27" width="5" height="17" rx="1" fill="url(#goldGrad)" opacity="0.7"/>
  <!-- Uptrend line -->
  <polyline points="16,30 24,22 32,16 40,24" fill="none" stroke="#F0D060" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dot at peak -->
  <circle cx="32" cy="16" r="2" fill="#F0D060"/>
  <!-- Text -->
  <text x="58" y="26" font-family="'Syne', Arial Black, sans-serif" font-weight="800" font-size="14" fill="#F5F5F0" letter-spacing="0.5">THE FUNDED</text>
  <text x="58" y="46" font-family="'Syne', Arial Black, sans-serif" font-weight="800" font-size="14" fill="url(#goldGrad)" letter-spacing="1">TRADERS</text>
  <!-- Tagline dot -->
  <rect x="58" y="50" width="30" height="1" fill="url(#goldGrad)" opacity="0.6"/>
</svg>
